<section id="hire" class="page-section">
  <div class="head text-center">
    <div class="contact-page">
      <div class="contact-container">
        <div class="contact-form-container">
          <h3>Send a message</h3>

          <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form" novalidate>
            <div class="form-group">
              <input
                type="text"
                formControlName="name"
                placeholder="Your Name"
                [ngClass]="{'invalid': submitted && f.name.errors}"
              />
              <div *ngIf="submitted && f.name.errors" class="error-message">
                Name is required and should be at least 2 characters
              </div>
            </div>

            <div class="form-group">
              <input
                type="email"
                formControlName="email"
                placeholder="Your Email"
                [ngClass]="{'invalid': submitted && f.email.errors}"
              />
              <div *ngIf="submitted && f.email.errors" class="error-message">
                <span *ngIf="f.email.errors.required">Email is required</span>
                <span *ngIf="f.email.errors.email">Invalid email format</span>
              </div>
            </div>

            <div class="form-group">
              <textarea
                formControlName="message"
                placeholder="Your Message"
                rows="4"
                [ngClass]="{'invalid': submitted && f.message.errors}"
              ></textarea>
              <div *ngIf="submitted && f.message.errors" class="error-message">
                Message is required and should be at least 10 characters
              </div>
            </div>

            <button type="submit" class="submit-btn">
              Send Message
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="feather feather-send"
              >
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>

          <!-- Success message -->
          <div *ngIf="formSuccess" class="success-message">
             Your message has been sent successfully!
          </div>

          <!-- Error message -->
          <div *ngIf="formError" class="error-message">
            ❌ Something went wrong. Please try again.
          </div>

          
        </div>

        <div class="map-container">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7064.047420351819!2d85.34410354363257!3d27.71655420253831!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39eb197d9d23f7ed%3A0x2724281b4393865d!2sChabahil%2C%20Kathmandu%2044600!5e0!3m2!1sen!2snp!4v1726028847851!5m2!1sen!2snp"
            width="100%"
            height="100%"
            style="border:0"
            allowfullscreen
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
      </div>
    </div>
  </div>
</section>
